[versions]
agp = "9.1.1"
kotlin = "2.2.10"
core-ktx = "1.2.0"
material = "1.3.0"
activity-compose = "1.3.0-alpha07"
navigation3 = "1.1.7"
kotlinx-serialization = "1.9.0"
compose = "1.0.0"
retrofit = "2.9.0"
logging-interceptor = "3.1.0"
junit = "4.12"
androidx-junit = "1.1.1"
espresso = "3.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
material = { module = "com.google.android.material:material", version.ref = "material" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
androidx-compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose" }
androidx-compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }

retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
logging-interceptor = { module = "com.github.ihsanbal:LoggingInterceptor", version.ref = "logging-interceptor" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[bundles]
app = [
    "androidx-core-ktx",
    "material",
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui",
    "kotlinx-serialization-core",
    "kotlinx-serialization-json",
    "androidx-activity-compose",
    "androidx-compose-ui",
    "androidx-compose-material",
    "androidx-compose-ui-tooling",
    "androidx-compose-runtime",
    "androidx-compose-runtime-livedata",
    "androidx-compose-material-icons",
    "retrofit-core",
    "retrofit-moshi",
    "logging-interceptor",
]
android-test = [
    "androidx-junit",
    "androidx-espresso-core",
    "androidx-compose-ui-test",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
